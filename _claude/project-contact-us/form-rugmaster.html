                    <input
                      type="hidden"
                      class="form-control"
                      id="formType"
                      name="formType"
                      value="no-photos"
                    />
                  </div>
                  <div class="form-group">
                    <label for="InputPhone">Contact phone (optional)</label>
                    <input
                      placeholder="e.g. 301.500.0919"
                      type="tel"
                      name="InputPhone"
                      id="InputPhone"
                      class="form-control"
                    />
                    <p>
                      <small
                        >Enter the phone number and calling preferences</small
                      >
                    </p>
                  </div>
                  <div class="form-group">
                    <label for="InputMessage">Message</label>
                    <textarea
                      name="InputMessage"
                      id="InputMessage"
                      class="form-control"
                      rows="5"
                      required
                    ></textarea>
                  </div>
                  <div class="form-group">
                    <label for="InputReal">What is 4+nine?</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Answer to the question above"
                      name="InputReal"
                      id="InputReal"
                      required
                      pattern="13"
                    /><span
                      visible-when-invalid="patternMismatch"
                      validation-for="InputReal"
                    >
                      Wrong Answer
                    </span>
                  </div>

                  <input
                    type="submit"
                    name="form_submit"
                    id="submit"
                    value="Submit"
                    class="btn btn-info pull-right"
                  />

                  <div submit-success>
                    <template type="amp-mustache">
                      Success! Thanks for contacting us!
                    </template>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </div>
    <!-- /container -->
  </body>
</html>
