<!doctype html>
<html amp lang="en">
<head>
<meta charset="utf-8">
<script async src="https://cdn.ampproject.org/v0.js"></script>
<script async custom-element="amp-list" src="https://cdn.ampproject.org/v0/amp-list-0.1.js"></script>
<script async custom-element="amp-bind" src="https://cdn.ampproject.org/v0/amp-bind-0.1.js"></script>
<script async custom-template="amp-mustache" src="https://cdn.ampproject.org/v0/amp-mustache-0.1.js"></script>
<title>Hello, AMP</title>
<link rel="canonical" href="https://ampb.in/" />
<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
<style amp-boilerplate>
body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}
</style>
<noscript>
<style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style>
</noscript>
</head>
<body>
  <amp-list width="auto" height="100" layout="fixed-height" src="https://oval-recess.glitch.me/countries">
      <template type="amp-mustache">
        <select on="
          change:
            AMP.setState({
              country: event.value,
              cities: original.items[0].countries.filter(x => x.name == event.value)[0]
            })"
        >
          <option value="">Choose a country...</option>
          {{#countries}}
            <option value="{{name}}">{{name}} - +{{code}}</option>
          {{/countries}}
        </select>
      </template>
  </amp-list>
  <amp-list hidden [hidden]="!country" width="auto" height="100" layout="fixed-height" [src]="cities" src="https://oval-recess.glitch.me/countries">
      <template type="amp-mustache">
        <select>
          {{#cities}}
            <option value="{{.}}">{{.}}</option>
          {{/cities}}
        </select>
      </template>
  </amp-list>
  <amp-state id="original" src="https://oval-recess.glitch.me/countries"></amp-state>
</body>
</html>
