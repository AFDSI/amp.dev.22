<div class='container'>
<section class='row well'>
<div class='col-lg-12'>
<h1 class='page-header'>
Welcome to Ontomatica
</h1>
</div>

<div class='col-md-6'>
<div class='panel panel-primary'>

<div class='panel-heading'>
<h4 id='quote-form-title' class='panel-title'>
<a
	 data-toggle='collapse'
	 href='#quote-form'
	 aria-expanded='true'
	 aria-controls='quote-form'
>
<i class='fa fa-fw fa-envelope'></i> Contact us
</a>
</h4>
</div>

<div class='panel-body panel-collapse collapse in' id='quote-form'>
<form
	 enctype='multipart/form-data'
	 action-xhr="/contactus/slack"
	 role='form'
	 target='_blank'
	 method='post'
	 custom-validation-reporting="show-all-on-submit"
	 id="submit_form"
>
<div class='col-md-10'>
<div class='form-group'>
<label for='InputName'>Your Name</label>
<input
	 type='text'
	 class='form-control'
	 name='InputName'
	 id='InputName'
	 placeholder='Enter Name' required
/>
</div>
<div class='form-group'>
<label for='InputEmail'>Your Email</label>
<input
	 type='email'
	 class='form-control'
	 id='InputEmail'
	 name='InputEmail'
	 placeholder='Enter Email' required
/>
<input
	 type='hidden'
	 class='form-control'
	 id='InputId'
	 name='InputId'
	 value='12ojqljf89evfel2oviif028fn'
/>
<input
	 type='hidden'
	 class='form-control'
	 id='formType'
	 name='formType'
	 value='no-photos'
/>
</div>
<div class='form-group'>
<label for='InputPhone'>Contact phone (optional)</label>
<input
	 placeholder='e.g. 301.500.0919'
	 type='tel'
	 
	 name='InputPhone'
	 id='InputPhone'
	 class='form-control'
/>
<p><small>Enter the phone number and calling preferences</small></p>
</div>
<div class='form-group'>
<label for='InputMessage'>Message</label>
<textarea
	 name='InputMessage'
	 id='InputMessage'
	 class='form-control'
	 rows='5'
	 required
></textarea>
</div>
<div class='form-group'>
<label for='InputReal'>What is 4+nine?</label>
<input
	 type='text'
	 class='form-control'
	 placeholder='Answer to the question above'
	 name='InputReal'
	 id='InputReal'
	 required
	 pattern='13'
/><span visible-when-invalid="patternMismatch"
      validation-for='InputReal'>
      Wrong Answer
    </span>
</div>

<input type='submit' name='form_submit' id='submit' value='Submit' class='btn btn-info pull-right'>

<div submit-success>
    <template type="amp-mustache">
      Success! Thanks for contacting us!
    </template>
</div>
</div>

</form>
</div></div></div></section></div> <!-- /container --></body></html>
