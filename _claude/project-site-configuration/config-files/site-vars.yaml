# site-vars.yaml
# Master configuration for multi-site deployment
# Location: /config/site-vars.yaml
#
# This file is the SINGLE SOURCE OF TRUTH for site-specific variables.
# All other configuration files either:
#   1. Read from this file directly (environment JSONs, static files)
#   2. Receive values via buildGrowPodSpec() (Jinja templates)
#
# To create a new site variant:
#   1. Copy this file to config/sites/mysite.yaml
#   2. Modify values as needed
#   3. Set SITE_CONFIG=mysite before build
#
# -----------------------------------------------------------------------------

# =============================================================================
# SITE IDENTITY
# =============================================================================

site:
  # Short identifier (used in package.json name, manifest short_name)
  id: "amp-new"
  
  # Full display name (used in titles, structured data)
  name: "AMP Project"
  
  # Site description
  description: "The AMP Project website - Build websites & stories with AMP"
  
  # Publisher/organization name (for structured data, copyright)
  publisher: "AMP Project"
  
  # Copyright holder (may differ from publisher)
  copyright_holder: "OpenJS Foundation and AMP Project"

# =============================================================================
# DOMAINS & URLS
# =============================================================================

domains:
  # Primary production domain
  production: "amp-new.netlify.app"
  
  # Staging/preview domain
  staging: "staging-amp-new.netlify.app"
  
  # Local development
  local: "localhost:8080"
  
  # Related subdomains/services
  playground: "playground-amp-new.netlify.app"
  preview: "preview-amp-new.netlify.app"
  
  # External blog (may be separate domain or subdomain)
  blog: "blog.amp.dev"

# Fully qualified URLs (derived from domains, but explicit for clarity)
urls:
  production: "https://amp-new.netlify.app"
  staging: "https://staging-amp-new.netlify.app"
  blog: "https://blog.amp.dev"
  playground: "https://playground-amp-new.netlify.app"

# =============================================================================
# REPOSITORY & SOURCE CONTROL
# =============================================================================

repository:
  # GitHub organization or user
  org: "AFDSI"
  
  # Repository name
  name: "amp-dev-22"
  
  # Full URLs (multiple formats for different uses)
  git_ssh: "git@github.com:AFDSI/amp-dev-22.git"
  git_https: "https://github.com/AFDSI/amp-dev-22"
  
  # Documentation link base (for "edit this page" links)
  docs_base: "https://github.com/AFDSI/amp-dev-22/blob/future/docs/"
  
  # Branch for documentation links
  default_branch: "future"

# =============================================================================
# ANALYTICS & TRACKING
# =============================================================================

analytics:
  # Google Analytics 4 Measurement ID
  ga4_tracking_id: "G-1HFVWLN28T"
  
  # Legacy Universal Analytics (if still needed)
  # ua_tracking_id: "UA-XXXXXXXX-X"

# =============================================================================
# GOOGLE CLOUD PLATFORM
# =============================================================================

gcp:
  # Primary project ID
  project_id: "amp-dev-230314"
  
  # App Engine domains
  appengine:
    production: "amp-dev-230314.appspot.com"
    staging: "amp-dev-staging.appspot.com"
    sxg: "amp-dev-sxg.appspot.com"
  
  # Cloud Functions base URL
  functions_base: "https://us-central1-amp-dev-230314.cloudfunctions.net"

# =============================================================================
# API ENDPOINTS
# =============================================================================

apis:
  # Page Experience / Pixi tool
  pixi:
    # Local development endpoints
    dev:
      lint: "http://localhost:8080/page-experience/api/lint"
      recommendations: "http://localhost:8080/page-experience/api/recommendations"
    # Production endpoints
    prod:
      lint: "https://amp-new.netlify.app/page-experience/api/lint"
      recommendations: "https://amp-new.netlify.app/page-experience/api/recommendations"
    # Cloud function (shared across environments)
    check_page_experience: "https://us-central1-amp-dev-230314.cloudfunctions.net/checkPageExperience"
  
  # External Google APIs (typically don't change per-site)
  google:
    pagespeed: "https://www.googleapis.com/pagespeedonline/v5/runPagespeed"
    mobile_friendly: "https://searchconsole.googleapis.com/v1/urlTestingTools/mobileFriendlyTest:run"
    custom_search: "https://www.googleapis.com/customsearch/v1"
  
  # Legacy/external services
  external:
    amp_by_example: "https://amp-by-example-api.appspot.com"

# =============================================================================
# SOCIAL MEDIA & COMMUNITY
# =============================================================================

social:
  twitter:
    handle: "@AMPhtml"
    url: "https://twitter.com/AMPhtml"
    # For structured data (without @)
    username: "ampproject"
  
  youtube:
    channel_url: "https://www.youtube.com/channel/UCXPBsjgKKG2HqsKBhWA4uQw"
  
  github:
    org_url: "https://github.com/ampproject"
    people_url: "https://github.com/orgs/ampproject/people"
    issues_url: "https://github.com/ampproject/amphtml/issues"
    amphtml_repo: "https://github.com/ampproject/amphtml"
  
  stackoverflow:
    tag_url: "https://stackoverflow.com/questions/tagged/amp-html"

# =============================================================================
# EXTERNAL RESOURCES (CDN, Fonts, etc.)
# =============================================================================

cdn:
  # AMP runtime CDN
  amp_runtime: "https://cdn.ampproject.org"
  amp_js: "https://cdn.ampproject.org/v0.js"
  
  # Google Fonts (typically unchanged)
  google_fonts: "https://fonts.googleapis.com"

# =============================================================================
# NEWSLETTER & FORMS
# =============================================================================

forms:
  # Newsletter signup (Google Forms or similar)
  newsletter_signup: "https://docs.google.com/forms/d/e/FORM_ID/viewform"

# =============================================================================
# BUILD METADATA
# =============================================================================

build:
  # Used for cache busting, version display
  version: "22.0.0"
  
  # Environment indicator
  # Typically overridden by CI/CD: SITE_ENV=production
  default_environment: "development"
